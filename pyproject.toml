[project]
name = "ams-ecal-qml"
version = "0.3.0"
description = "Physics-informed simulation and QML classification of AMS-02 ECAL events."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5.1,<3",
    "pyyaml>=6.0.3,<7",
    "scipy>=1.17,<2",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
geant4 = [
    "geant4-pybind==0.1.3",
]
validation = [
    "scikit-learn>=1.9.1",
]
# GPU benchmarks (2026-10-16): the CUDA 13.0 build of PyTorch from the official index; install with
#   uv pip install "torch==2.14.1+cu130" --index-url https://download.pytorch.org/whl/cu130
ml = [
    "torch>=2.14.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ams_ecal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

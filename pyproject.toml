[project]
name = "ams-ecal-qml"
version = "0.3.0"
description = "Physics-informed simulation and QML classification of AMS-02 ECAL events."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5.1,<3",
    "pyyaml>=6.0.3,<7",
    "scipy>=1.17,<2",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
geant4 = [
    "geant4-pybind==0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ams_ecal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

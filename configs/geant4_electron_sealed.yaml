# SEALED electron validation set for the EM generator contract (researcher's approval,
# 2026-10-02: "Yes to all"; plan section 4, B2). The existing 4000-electron sample
# (configs/geant4_electron_sample.yaml) stays the exploration and calibration set.
#
# NEVER OPENED before the EM generator's one opening. Read only through ams_ecal.sealed_set.
# Same geometry, physics list, cut and entry spot as the electron sample. 1000 events at each
# of 7 energies (four anchors and the off-anchor 14, 30, 70 GeV). Seeds:
# SeedSequence([base_seed, energy x 1000]) with a base seed used nowhere else.
schema_version: 2

particle: e-

energies_gev: [10.0, 14.0, 20.0, 30.0, 50.0, 70.0, 100.0]

incidence:
  theta: 0.0
  phi: 0.0
entry_spot:
  x_min: 0.0
  x_max: 9.0
  y_min: 0.0
  y_max: 9.0
gun_z: -1.0

physics:
  lists: [FTFP_BERT]
  production_cut: 0.7

samples:
  sealed:
    geometry: ams
    physics_list: FTFP_BERT
    events_per_energy: 1000
    base_seed: 20271002

store_fine_prefix_deposits: true

output_dir: data/geant4_electron_sealed

# G-train electrons for the multiscale ladder and sample-efficiency curves (plan 2026-10-09, researcher's approval 2026-10-09). EXPOSED development data, never a validation set. Same geometry, list, cut and entry spot as the electron sample; base seed used nowhere else.
schema_version: 2

particle: e-

energies_gev: [10.0, 20.0, 50.0, 100.0]

incidence:
  theta: 0.0
  phi: 0.0
entry_spot:
  x_min: 0.0
  x_max: 9.0
  y_min: 0.0
  y_max: 9.0
gun_z: -1.0

physics:
  lists: [FTFP_BERT]
  production_cut: 0.7

samples:
  train:
    geometry: ams
    physics_list: FTFP_BERT
    events_per_energy: 10000
    base_seed: 20272001

store_fine_prefix_deposits: true

output_dir: data/geant4_electron_train

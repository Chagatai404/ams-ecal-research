# Component-tagged calibration for the particle-agnostic sampling response R-A (design 2026-10-12, approved PA.1-PA.5).
# Electrons, 2000 per energy. EXPOSED development data, never a validation set. Base seed used nowhere else. Component tagging adds C++ scorers only;
# the control run reproduced the untagged grids exactly (electrons 100/100, protons 300/300 against the untagged rerun).
schema_version: 2

particle: e-

energies_gev: [5.0, 10.0, 20.0, 50.0, 100.0, 200.0]

incidence:
  theta: 0.0
  phi: 0.0
entry_spot:
  x_min: 0.0
  x_max: 9.0
  y_min: 0.0
  y_max: 9.0
gun_z: -1.0

physics:
  lists: [FTFP_BERT]
  production_cut: 0.7

samples:
  train:
    geometry: ams
    physics_list: FTFP_BERT
    events_per_energy: 2000
    base_seed: 20273001

store_fine_prefix_deposits: false
component_tagging: true

output_dir: data/geant4_component_electron

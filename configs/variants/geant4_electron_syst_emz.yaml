# G-syst electrons, alternative EM physics list FTFP_BERT_EMZ (accurate EM: the best set of EM models from the low-energy and standard packages, slower (Physics List Guide)). NOT reached through G4PhysListFactory: the list is assembled by hand in geant4_backend._ftfp_bert_with_em (FTFP_BERT's constructors with G4EmStandardPhysics_option4 in place of G4EmStandardPhysics), because the factory's objects cannot be handed to SetUserInitialization in this pybind build. [Comment corrected 2026-10-11 (review C15); the configuration SHA-256 in the generated metadata is of the earlier text.] The earlier FTFP_BERT_TRV choice was withdrawn: TRV and ATL vary the hadronic side only. Exposed development data.
schema_version: 2

particle: e-

energies_gev: [20.0, 100.0]

incidence:
  theta: 0.0
  phi: 0.0
entry_spot:
  x_min: 0.0
  x_max: 9.0
  y_min: 0.0
  y_max: 9.0
gun_z: -1.0

physics:
  lists: [FTFP_BERT_EMZ]
  production_cut: 0.7

samples:
  emz:
    geometry: ams
    physics_list: FTFP_BERT_EMZ
    events_per_energy: 2000
    base_seed: 20272003

store_fine_prefix_deposits: true

output_dir: data/geant4_electron_syst_emz

# G-syst electrons, alternative EM physics list FTFP_BERT_EMV (EM option 1: less precise, faster (Physics List Guide)). NOT reached through G4PhysListFactory: the list is assembled by hand in geant4_backend._ftfp_bert_with_em (FTFP_BERT's constructors with G4EmStandardPhysics_option1 in place of G4EmStandardPhysics), because the factory's objects cannot be handed to SetUserInitialization in this pybind build. [Comment corrected 2026-10-11 (review C15); the configuration SHA-256 in the generated metadata is of the earlier text. First dump (scalar getters only) reported ApplyCuts false -> true and MscRangeFactor 0.04 -> 0.2; INCOMPLETE. Geant4's printed table, results/em_variants/printed_table_differences_FTFP_BERT_vs_EMV.json, shows also msc step limit UseSafety -> Minimal, e+- step function (0.2, 1 mm) -> (0.8, 1 mm), fluctuation model Urban -> Universal, combined TransportationWithMsc on, no Rayleigh scattering.] The earlier FTFP_BERT_TRV choice was withdrawn: TRV and ATL vary the hadronic side only. Exposed development data.
schema_version: 2

particle: e-

energies_gev: [20.0, 100.0]

incidence:
  theta: 0.0
  phi: 0.0
entry_spot:
  x_min: 0.0
  x_max: 9.0
  y_min: 0.0
  y_max: 9.0
gun_z: -1.0

physics:
  lists: [FTFP_BERT_EMV]
  production_cut: 0.7

samples:
  emv:
    geometry: ams
    physics_list: FTFP_BERT_EMV
    events_per_energy: 2000
    base_seed: 20272005

store_fine_prefix_deposits: true

output_dir: data/geant4_electron_syst_emv

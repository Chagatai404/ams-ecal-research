# G-syst electrons, alternative EM-physics list FTFP_BERT_TRV (available in the installed geant4_pybind; its EM constructor is to be confirmed from the Physics List Guide, which has not been read). Production cut 0.7 mm. Exposed development data.
schema_version: 2

particle: e-

energies_gev: [20.0, 100.0]

incidence:
  theta: 0.0
  phi: 0.0
entry_spot:
  x_min: 0.0
  x_max: 9.0
  y_min: 0.0
  y_max: 9.0
gun_z: -1.0

physics:
  lists: [FTFP_BERT_TRV]
  production_cut: 0.7

samples:
  em_trv:
    geometry: ams
    physics_list: FTFP_BERT_TRV
    events_per_energy: 2000
    base_seed: 20272003

store_fine_prefix_deposits: true

output_dir: data/geant4_electron_syst_em

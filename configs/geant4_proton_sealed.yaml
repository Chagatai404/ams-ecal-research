# SEALED proton validation set for the repaired FastMC proton model (researcher's approval,
# 2026-10-02: "Yes to all"; plan section 4, B2; added checks registered the same day).
#
# NEVER OPENED before the final validation. Read only through ams_ecal.sealed_set, which
# refuses without an explicit final flag and appends to a committed opening ledger.
# Matched to the proton pilot baseline (AMS-only geometry, FTFP_BERT, production cut 0.7 mm,
# entry spot over one cell, normal incidence). 3000 events at each of 7 energies: the four
# calibration anchors and three OFF-ANCHOR energies (14, 30, 70 GeV) that test the
# interpolation in ln E. Seeds: SeedSequence([base_seed, energy x 1000]), a base seed used
# nowhere else (earlier: 20260929-20261002, 20270000, 20261003-20261023).
schema_version: 2

particle: proton

energies_gev: [10.0, 14.0, 20.0, 30.0, 50.0, 70.0, 100.0]

incidence:
  theta: 0.0
  phi: 0.0
entry_spot:
  x_min: 0.0
  x_max: 9.0
  y_min: 0.0
  y_max: 9.0
gun_z: -1.0

physics:
  lists: [FTFP_BERT]
  production_cut: 0.7

samples:
  sealed:
    geometry: ams
    physics_list: FTFP_BERT
    events_per_energy: 3000
    base_seed: 20271001

store_fine_prefix_deposits: true

output_dir: data/geant4_proton_sealed
